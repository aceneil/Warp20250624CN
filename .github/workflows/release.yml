name: release

# 只发桌面程序：Linux + Windows 的 warp-gui。
# 命令行版 warp_rs 不再单独发资产（源码自取即可）。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 逻辑层自检：不需要图形库，任何平台都能跑
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            tools/warp_gui -> tools/warp_gui/target
      # 去痕迹自检：私有项目名字 / 品牌词 / 内网地址不许出现在文件、提交信息里
      - name: scan for private strings
        run: bash scripts/check-no-private-strings.sh --history
      - run: cargo test --release --workspace
      - run: cargo test --release --manifest-path tools/warp_gui/Cargo.toml

  gui-linux:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/warp_gui -> tools/warp_gui/target
      - name: install webkit deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libsoup-3.0-dev
      - name: build (Tauri GUI)
        run: cargo build --release --features gui --manifest-path tools/warp_gui/Cargo.toml
      - name: package
        run: |
          set -euo pipefail
          mkdir -p dist
          cp tools/warp_gui/target/release/warp-gui dist/
          strip dist/warp-gui || true
          tar -czf dist/warp-gui-linux-x86_64.tar.gz -C dist warp-gui
          sha256sum dist/warp-gui-linux-x86_64.tar.gz > dist/SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: gui-linux
          path: dist/*

  gui-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/warp_gui -> tools/warp_gui/target
      - name: build (Tauri GUI)
        run: cargo build --release --features gui --manifest-path tools/warp_gui/Cargo.toml
      - name: package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item tools/warp_gui/target/release/warp-gui.exe dist/
          Compress-Archive -Path dist/warp-gui.exe -DestinationPath dist/warp-gui-windows-x86_64.zip -Force
          $hash = (Get-FileHash dist/warp-gui-windows-x86_64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  warp-gui-windows-x86_64.zip" | Set-Content -Encoding ascii dist/SHA256SUMS-windows.txt
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: gui-windows
          path: dist/*

  release:
    needs: [gui-linux, gui-windows]
    # 只有打 tag 才发 Release（workflow_dispatch 在分支上跑只做构建烟测）
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: list assets
        run: ls -l assets
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            assets/warp-gui-linux-x86_64.tar.gz
            assets/warp-gui-windows-x86_64.zip
            assets/SHA256SUMS-linux.txt
            assets/SHA256SUMS-windows.txt
          body: |
            warp_gui —— RO 客户端补丁工具的桌面界面（Tauri v2）。

            | 平台 | 文件 | 依赖 |
            |---|---|---|
            | Linux x86-64 | `warp-gui-linux-x86_64.tar.gz` | webkit2gtk-4.1 |
            | Windows x86-64 | `warp-gui-windows-x86_64.zip` | Win10/11 自带 WebView2 |

            补丁表来自仓库里的 `patches/*.yml`；工具本身不含游戏客户端，
            只修改你自己有权修改的 exe。
