[package]
name = "warp_rs"
version = "0.1.0"
edition = "2021"
description = "RO 客户端补丁引擎（WARP 核心能力的 Rust 重写）"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
# 编码转换（GBK / CP949 / UTF-8）。离线构建：crate 已在本地 cargo 缓存里。
encoding_rs = "0.8"

[[bin]]
name = "warp_rs"
path = "src/main.rs"
