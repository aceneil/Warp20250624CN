# warp_rs 语言包 —— English：与 zh-cn.yml 同一批 find，换 replace 即可切语言
# 目标客户端：2025-06-04 Ragexe（PE32，未加壳）
#
# 表头 meta：
#   lang      语言代码
#   name      语言名（启动器下拉框显示）
#   encoding  写进 exe 的字节编码（客户端按系统 ANSI 代码页解码，这里是 GBK）
#
# YAML 一律 UTF-8；replace 里写的是 GBK 字节（hex）。
#
# 字段说明：
#   id       唯一标识
#   desc     说明（启动器界面上显示）
#   find     搜索特征串（hex，?? 为通配）
#   replace  替换字节（hex）
#   section  限定在哪个段里搜
#   expect   期望命中次数（不符即失败）
#   nth      打第几次命中（1 开始）
#   all      是否把所有命中都打上
#   terminate 替换后是否补一个 00 字符串结束符
#   dates    按 PE 编译时间（YYYYMMDD）过滤
#   disabled 是否停用（跳过但不算失败）
meta:
  lang: en
  name: English
  encoding: gbk
version: 1
patches:
  - id: skill_timer_hour
    desc: "%d 小时（%d hour）"
    desc_en: "%d hour"
    find: "25 64 20 BD C3 B0 A3 20"
    replace: "25 64 20 68 6F 75 72"
    section: .rdata
    expect: 4
    all: true
    terminate: false
    mode: replace
    dates: { start: 20100000, end: 20991231 }
    # 同一字符串在 exe 里出现 4 次，全部替换
  - id: skill_timer_minutes
    desc: "%d 分（%d min）"
    desc_en: "%d min"
