# WARP 等价补丁表（逐字节复现某个已验证可启动的 WARP 产物）
#
# 用途：当语义化补丁难以完全复现 WARP 的行为时，用「固定偏移 + 原字节校验」
# 把 WARP 实际写入的每一段原样落下来，产物与 WARP 输出逐字节相同。
#
# 生成方式：diff(pristine, warp_output) → 每个差异块一条 offset 补丁。
# 校验：apply 后 md5 必须等于参照产物的 md5。
