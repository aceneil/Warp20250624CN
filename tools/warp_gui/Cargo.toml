[package]
name = "warp_gui"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "warp_rs 的图形前端（Tauri v2：Windows / Linux / macOS 共用同一套前端）"
license = "MIT"
publish = false

# 纯逻辑库（可被集成测试引用，不依赖 tauri）
[lib]
name = "warp_gui"
path = "src/lib.rs"

# 图形程序
[[bin]]
name = "warp-gui"
path = "src/main.rs"

# 构建说明（build-dependencies 不能被 feature 门控，所以 tauri-build 始终参与编译，
# 但只有开 gui 时才真正执行 build()）
# ----------
# Tauri 由 `gui` feature 控制，默认关闭：
#   * 不带 feature：只编译逻辑层 + 命令行占位壳，任何平台都不需要 webkit2gtk
#     → 本地 `cargo test` / `cargo build` 秒过
#   * `cargo build --features gui`：
#       Windows：链 WebView2（系统自带），可从 Linux 用 cargo xwin 交叉编译
#       Linux  ：需要 webkit2gtk-4.1 / libsoup-3 / gtk3 开发包（CI 里 apt 装齐）
# 发版产物就是这么来的：CI 在 ubuntu-latest 与 windows-latest 各跑一次 --features gui。
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 补丁引擎（warp_rs）：本 crate 直接依赖它的库 API，不起子进程。
# 关闭 default features：只要库，不要命令行版那套 clap。
warp_rs = { path = "../..", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# md5（界面上显示客户端 exe 的 md5）
md-5 = "0.11"
# 桌面壳：只有开 gui feature 才拉进来
tauri = { version = "2", features = [], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }

[features]
default = []
gui = ["dep:tauri", "dep:tauri-plugin-dialog"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
