[package]
name = "warp_gui"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "warp_rs 的图形前端（Tauri v2：Windows / Linux / macOS 共用同一套前端）"
license = "MIT"
publish = false

# 纯逻辑库（可被集成测试引用，不依赖 tauri）
[lib]
name = "warp_gui"
path = "src/lib.rs"

# 图形程序
[[bin]]
name = "warp-gui"
path = "src/main.rs"

# 说明：Tauri GUI 只在 Windows 目标下编译。
#   * Windows：WebView2（Win10/11 自带），不依赖系统库，Linux 上可交叉编译
#   * Linux ：编译产物仅为「命令行版」，用于验证核心逻辑（无需 webkit2gtk 开发包）
[build-dependencies]
# tauri-build 只在编译期生成上下文/资源，始终以 host 编译
tauri-build = { version = "2", features = [] }

[target.'cfg(target_os = "windows")'.dependencies]
tauri = { version = "2", features = [] }
# 原生「打开文件」对话框（浏览…按钮）
tauri-plugin-dialog = "2"

[dependencies]
# 补丁引擎（warp_rs）：本 crate 直接依赖它的库 API，不起子进程。
# 关闭 default features：只要库，不要命令行版那套 clap。
warp_rs = { path = "../..", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# md5（界面上显示客户端 exe 的 md5）
md-5 = "0.11"

[features]
default = []

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
